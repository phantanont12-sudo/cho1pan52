/* ── TOP BAR ── */
.topbar{background:#1a1a1a;color:#fff;padding:0 18px;display:flex;align-items:center;min-height:48px;gap:4px;flex-wrap:wrap;}
.topbar-title{font-size:13px;font-weight:500;margin-right:12px;padding:10px 0;white-space:nowrap;}
.top-tab{font-size:12px;padding:0 13px;height:48px;border:none;border-bottom:2px solid transparent;color:#aaa;background:none;cursor:pointer;font-family:inherit;white-space:nowrap;}
.top-tab.on{color:#fff;border-bottom-color:#fff;}
.topbar-stat{margin-left:auto;font-size:11px;color:#666;padding:10px 0;white-space:nowrap;}

/* ── VIEWS ── */
.view{display:none;} .view.on{display:block;}

/* ── GRID VIEW (original style) ── */
.controls{display:flex;border-bottom:1px solid #e0ddd8;background:#fff;padding:10px 16px;flex-wrap:wrap;gap:8px;align-items:center;}
input[type=text]{padding:6px 12px;font-size:12px;border:1px solid #ddd;border-radius:20px;outline:none;font-family:inherit;background:#fff;}
#search{width:200px;}
.ctrl-group{display:flex;gap:6px;flex-wrap:wrap;}
.filter-btn{font-size:11px;padding:5px 12px;border:1px solid #ddd;border-radius:20px;cursor:pointer;background:#fff;color:#888;font-family:inherit;}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.stats{display:flex;gap:14px;font-size:11px;color:#888;margin-left:auto;flex-wrap:wrap;}
.stat{display:flex;align-items:center;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;padding:14px 16px;}
.card{background:#fff;border:1px solid #e0ddd8;border-radius:10px;padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative;}
.card:hover{border-color:#888;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.card.risk-red{border-left:3px solid #E24B4A;}
.card.risk-amber{border-left:3px solid #EF9F27;}
.card.risk-green_watch{border-left:3px solid #639922;}
.card.risk-none{border-left:3px solid #e0ddd8;}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.card-no{font-size:10px;color:#aaa;}
.card-name{font-size:12px;font-weight:500;color:#1a1a1a;line-height:1.3;}
.card-nick{font-size:10px;color:#888;}
.card-badges{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.cbadge{font-size:9px;padding:1px 6px;border-radius:10px;font-weight:500;}
.cb-red{background:#FCEBEB;color:#A32D2D;}
.cb-amber{background:#FAEEDA;color:#854F0B;}
.cb-green{background:#EAF3DE;color:#3B6D11;}
.cb-blue{background:#E6F1FB;color:#185FA5;}
.cb-gray{background:#f1efe8;color:#5F5E5A;}
.appt-dot{width:6px;height:6px;border-radius:50%;background:#E24B4A;display:inline-block;margin-left:3px;vertical-align:middle;}
.empty-state{text-align:center;padding:40px;color:#aaa;font-size:13px;}

/* ── AVATAR ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;cursor:pointer;overflow:hidden;position:relative;flex-shrink:0;}
.av.dash{border:2px dashed #ccc;}
.av.solid{border:2px solid #e0ddd8;}
.av img{width:100%;height:100%;object-fit:cover;}
.av:hover .av-hint{opacity:1;}
.av-hint{position:absolute;inset:0;background:rgba(0,0,0,.45);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
.av-del-btn{position:absolute;bottom:-2px;right:-2px;width:17px;height:17px;border-radius:50%;background:#E24B4A;color:#fff;border:2px solid #fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.avc0{background:#185FA5;}.avc1{background:#3B6D11;}.avc2{background:#854F0B;}
.avc3{background:#534AB7;}.avc4{background:#A32D2D;}.avc5{background:#0F6E56;}
.avc6{background:#993556;}.avc7{background:#5F5E5A;}

/* ── SQUAD VIEW ── */
.sq-tb{padding:10px 16px;background:#fff;border-bottom:1px solid #e0ddd8;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.sq-tb input{width:180px;}
.ftab{font-size:11px;padding:5px 11px;border:1px solid #ddd;border-radius:20px;cursor:pointer;background:#fff;color:#888;font-family:inherit;}
.ftab.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a;}
.sq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px;padding:14px 16px;}
.sq-card{background:#fff;border:1px solid #e0ddd8;border-radius:10px;overflow:hidden;}
.sq-hd{background:#1a1a1a;color:#fff;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;}
.sq-hd-l{font-size:13px;font-weight:500;}
.sq-hd-r{font-size:11px;color:#aaa;}
.instr-bar{padding:7px 10px;background:#eef5ff;border-bottom:1px solid #dde8f5;font-size:11px;}
.instr-row{display:flex;align-items:center;padding:1px 0;}
.instr-lbl{color:#185FA5;font-weight:500;width:68px;flex-shrink:0;}
.instr-val{color:#1a1a1a;flex:1;}
.edit-btn{font-size:10px;color:#185FA5;cursor:pointer;border:none;background:none;padding:2px 4px;font-family:inherit;}
.rbar{height:3px;}
.rbar-red{background:#E24B4A;}.rbar-amber{background:#EF9F27;}.rbar-green{background:#639922;}.rbar-none{background:#e0ddd8;}
.pairs{} .pair{display:flex;border-bottom:1px solid #f5f3f0;} .pair:last-child{border-bottom:none;}
.si{flex:1;padding:7px 9px;border-right:1px dashed #eee;display:flex;gap:7px;align-items:flex-start;}
.si:last-child{border-right:none;}

</div>

// ── โหลดข้อมูลจาก Firebase ──
function loadLS(){
  // โหลด APPTS จาก Firebase
  db.ref('appts').on('value',function(snap){
    var data=snap.val();
    if(data){for(var k in data)APPTS[k]=data[k];}
    renderAlerts();updateBadge();
    // อัปเดต appt dots บน card
    var g=document.getElementById('grid');
    if(g&&g.children.length===0) doFilter();
    else doFilter();
  });
  // โหลด INSTRS จาก Firebase
  db.ref('instrs').on('value',function(snap){
    var data=snap.val();
    if(data){for(var k in data)INSTRS[k]=data[k];}
  });
  // โหลด PHOTOS จาก Firebase
  db.ref('photos').on('value',function(snap){
    var data=snap.val();
    if(data){
      for(var k in data){
        if(data[k]) PHOTOS[k]=data[k];
      }
    }
    // Re-render grid เพื่อให้รูปขึ้นทุกเครื่อง
    doFilter();
    renderSquads();
    // แจ้ง QR handler ว่ารูปโหลดแล้ว
    if(window._onPhotosLoaded) window._onPhotosLoaded();
    // ถ้า popup เปิดอยู่แล้ว ให้ refresh รูปใน popup
    var ov=document.getElementById('overlay');
    if(ov&&ov.className.indexOf('on')!==-1){
      var popAv=document.getElementById('pop-av');
      if(popAv&&popAv.firstChild){
        var curNo=parseInt(popAv.firstChild.getAttribute('data-avno'));
        if(curNo>0) buildPopAv(curNo);
      }
    }
  });
}

// ── บันทึก APPTS ลง Firebase ──
function saveLS(){
  db.ref('appts').set(APPTS);
  db.ref('instrs').set(INSTRS);
}

// ── บันทึกรูปใน localStorage (รูปใหญ่เกิน Firebase ฟรี) ──
function savePhotos(){
  try{
    db.ref('photos').set(PHOTOS,function(err){
      if(err) alert('บันทึกรูปไม่สำเร็จ: '+err.message);
    });
  }catch(e){alert('เกิดข้อผิดพลาด: '+e);}
}

function getS(no){for(var i=0;i<SOLDIERS.length;i++){if(SOLDIERS[i].no===no)return SOLDIERS[i];}return null;}
function getAppt(no){return APPTS[String(no)]||{date:'',note:''};}
function getPhoto(no){return PHOTOS[String(no)]||'';}
function daysDiff(ds){if(!ds)return null;var d=new Date(ds),n=new Date();n.setHours(0,0,0,0);d.setHours(0,0,0,0);return Math.round((d-n)/86400000);}
function fmtDate(ds){if(!ds)return'';var d=new Date(ds);var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}
function rLabel(r){return{red:'งดฝึก',amber:'ลดปริมาณ',green_watch:'เฝ้าระวัง',none:'ปกติ'}[r]||r;}
function rColor(r){return{red:'#A32D2D',amber:'#854F0B',green_watch:'#3B6D11',none:'#888'}[r]||'#888';}
function bLabel(b){if(!b||b===0)return'-';return b.toFixed(1)+(b<=18.5?' (ผอม)':b<=28?' (ปกติ)':b<=30?' (เริ่มอ้วน)':' (อ้วน)');}
function bCls(b){if(!b||b===0)return'';return(b>30||(b>0&&b<=18.5))?'iv-red':b>28?'iv-amber':'iv-green';}
function avBg(no){var cls=['#185FA5','#3B6D11','#854F0B','#534AB7','#A32D2D','#0F6E56','#993556','#5F5E5A'];return cls[no%8];}
function initials(s){return s.fname?s.fname.charAt(0):'';}

function makeTags(s){

}

    ['ฐานะ',s.fam_finance],['เสาหลักครอบครัว',s.breadwinner]
  ]));body.appendChild(fs);
  // Appointment
  var aps=document.createElement('div');aps.className='sec';var apst=document.createElement('div');apst.className='sec-t';apst.textContent='นัดแพทย์';aps.appendChild(apst);
  var apb=document.createElement('div');apb.className='appt-box';
  var apl=document.createElement('div');apl.className='appt-lbl';apl.textContent='บันทึก / แก้ไขวันนัด';apb.appendChild(apl);
  if(appt.date){
    var apc=document.createElement('div');apc.className='appt-cur';apc.textContent='วันที่ '+fmtDate(appt.date)+' — '+(appt.note||'ไม่มีหมายเหตุ')+' ';
    var apdel=document.createElement('button');apdel.className='btn-g';apdel.textContent='ลบนัด';
    (function(n){apdel.onclick=function(){delete APPTS[String(n)];saveLS();showPop(n);renderAlerts();updateBadge();sendTelegramDelete(n);};})(no);
    apc.appendChild(apdel);apb.appendChild(apc);
  }
  var apf=document.createElement('div');apf.className='appt-form';
  var apd=document.createElement('input');apd.type='date';apd.id='apd-'+no;apd.value=appt.date||'';
  var apn=document.createElement('input');apn.type='text';apn.id='apn-'+no;apn.placeholder='หมายเหตุ เช่น นัดตรวจซ้ำสารเสพติด';apn.value=appt.note||'';
  var apsv=document.createElement('button');apsv.className='btn-p';apsv.textContent='บันทึกนัด';
  (function(n){apsv.onclick=function(){
    var d=document.getElementById('apd-'+n).value,nt=document.getElementById('apn-'+n).value;
    if(!d){alert('กรุณาเลือกวันนัด');return;}
    APPTS[String(n)]={date:d,note:nt};saveLS();showPop(n);renderAlerts();updateBadge();sendTelegramNow(n,d,nt);
  };})(no);
  apf.appendChild(apd);apf.appendChild(apn);apf.appendChild(apsv);apb.appendChild(apf);aps.appendChild(apb);body.appendChild(aps);
  // Contact
  if(s.contact&&s.contact!=='-'){
    var cos=document.createElement('div');cos.className='sec';var cost=document.createElement('div');cost.className='sec-t';cost.textContent='ผู้ติดต่อฉุกเฉิน';cos.appendChild(cost);
    var cob=document.createElement('div');cob.className='contact-box';
    var con=document.createElement('div');con.className='contact-name';con.textContent=s.contact+' ('+s.contact_rel+')';
    var cot=document.createElement('div');cot.className='contact-tel';cot.textContent='โทร. '+s.contact_tel;
    cob.appendChild(con);cob.appendChild(cot);
    if(s.phone&&s.phone!=='-'){var cop=document.createElement('div');cop.style.cssText='font-size:11px;color:#666;margin-top:2px;';cop.textContent='มือถือทหาร: '+s.phone;cob.appendChild(cop);}
    cos.appendChild(cob);body.appendChild(cos);
  }
  document.getElementById('overlay').className='overlay on';document.body.style.overflow='hidden';
}
function closePop(){document.getElementById('overlay').className='overlay';document.body.style.overflow='';}
function ovBg(e){if(e.target===document.getElementById('overlay'))closePop();}

// Instructor Modal
function openIM(sq){
  editSq=sq;var instr=INSTRS[sq]||{nst:'',crew:['','']};
  document.getElementById('im-title').textContent='แก้ไขครูประจำหมู่ '+sq;
  document.getElementById('im-nst').value=instr.nst||'';
  var crew=instr.crew&&instr.crew.length?instr.crew:['',''];
  var c=document.getElementById('im-crew');c.innerHTML='';
  crew.forEach(function(val,i){
    var div=document.createElement('div');div.className='im-f';
    var lbl=document.createElement('label');lbl.textContent='ครูทหารใหม่ คนที่ '+(i+1);
    var inp=document.createElement('input');inp.type='text';inp.className='im-cr';inp.value=val||'';inp.placeholder='ชื่อ-สกุล';
    div.appendChild(lbl);div.appendChild(inp);c.appendChild(div);
  });
  document.getElementById('im-ov').className='im-ov on';
}
function addCrew(){
  var c=document.getElementById('im-crew');var n=c.querySelectorAll('.im-cr').length+1;
  var div=document.createElement('div');div.className='im-f';
  var lbl=document.createElement('label');lbl.textContent='ครูทหารใหม่ คนที่ '+n;
  var inp=document.createElement('input');inp.type='text';inp.className='im-cr';inp.placeholder='ชื่อ-สกุล';
  div.appendChild(lbl);div.appendChild(inp);c.appendChild(div);
}
function remCrew(){var c=document.getElementById('im-crew');var fs=c.querySelectorAll('.im-f');if(fs.length>1)fs[fs.length-1].remove();}
function saveIM(){
  var nst=document.getElementById('im-nst').value.trim();
  var crew=Array.from(document.querySelectorAll('.im-cr')).map(function(i){return i.value.trim();});
  INSTRS[editSq]={nst:nst,crew:crew};saveLS();closeIM();renderSquads();
}
function closeIM(){document.getElementById('im-ov').className='im-ov';editSq=null;}
function imBg(e){if(e.target===document.getElementById('im-ov'))closeIM();}

function updateBadge(){
  var cnt=Object.keys(APPTS).filter(function(no){var d=daysDiff(APPTS[no].date);return d!==null&&d>=0&&d<=7;}).length;
  document.getElementById('abadge').textContent=cnt?'('+cnt+')':'';
}
function renderStats(){
  var r=0,a=0,g=0;SOLDIERS.forEach(function(s){if(s.risk==='red')r++;else if(s.risk==='amber')a++;else if(s.risk==='green_watch')g++;});
  document.getElementById('nstat').textContent='งดฝึก '+r+' · ลด '+a+' · เฝ้า '+g+' · รวม '+SOLDIERS.length+' นาย';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closePop();closeIM();}});
// render จาก SOLDIERS array ทันที (ไม่ต้องรอ Firebase)
buildSqTabs();doFilter();renderSquads();renderStats();updateBadge();
// โหลด appts/instrs จาก Firebase แล้ว re-render
loadLS();
// เปิด popup อัตโนมัติถ้ามี ?no=X ใน URL (รอรูปโหลดจาก Firebase ก่อน)
(function(){
  var params=new URLSearchParams(window.location.search);
  var no=parseInt(params.get('no'));
  if(no>0){
    // รอให้ Firebase โหลดรูปก่อนเปิด popup
    var photoLoaded=false;
    var popupShown=false;
    function tryShowPop(){
      if(popupShown) return;
      popupShown=true;
      showPop(no);
    }
    // เปิด popup เมื่อ photos โหลดแล้ว (max รอ 3 วินาที)
    var checkInterval=setInterval(function(){
      if(photoLoaded){clearInterval(checkInterval);tryShowPop();}
    },100);
    // fallback: เปิดเลยถ้ารอนานเกิน 3 วินาที
    setTimeout(function(){clearInterval(checkInterval);tryShowPop();},3000);
    // ฟังก์ชัน hook รอ photos loaded
    window._onPhotosLoaded=function(){photoLoaded=true;};
  }
})();
</script>
